name: creditos_pollos_keny
description: App móvil de Créditos Pollos Keny para emprendedores avícolas y porcícolas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Red y almacenamiento seguro
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Formato de monedas y fechas
  intl: ^0.19.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
